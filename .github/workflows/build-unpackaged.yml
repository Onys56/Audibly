name: Build Audibly

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild Audibly.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build unpackaged Audibly
        run: msbuild Audibly.sln /t:Publish /p:WindowsPackageType=None /p:Configuration=Release /p:Platform=x64

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            Audibly.App/bin/x64/Release/net8.0-windows10.0.19041.0/publish/* `
            Audibly-fixed.zip

      - name: Upload Audibly
        uses: actions/upload-artifact@v4
        with:
          name: Audibly-fixed
          path: Audibly-fixed.zip